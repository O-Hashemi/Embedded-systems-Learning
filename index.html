<!DOCTYPE html>
<html>

<head>
    <title>Squirtle Smart Garden</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="header">
        <h1>🐢 Squirtle Smart Garden</h1>
        <p>Automated Plant Watering System</p>
    </div>

    <div class="card">
        <h2>🌡 Temperature</h2>
        <p>24°C</p>
    </div>

    <div class="card">
        <h2>💧 Humidity</h2>
        <p>55%</p>
    </div>

    <div class="card">
        <h2>🚰 Water Level</h2>
        <p class="good">OK</p>
    </div>

    <div class="card">
        <h2>⚙️ Pump Status</h2>
        <p class="off">OFF</p>
    </div>

    <div class="card">
        <h2>🕒 Last Watered</h2>
        <p>7:43 PM</p>
    </div>

    <div class="card">
        <h2>⏳ Cooldown</h2>
        <p class="good">Ready</p>
    </div>

    <div class="card">
        <h2>🌱 Plant Status</h2>
        <p class="good">Healthy</p>
    </div>

</body>

</html>
