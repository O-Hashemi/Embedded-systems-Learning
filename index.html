<!DOCTYPE html>
<html>

<head>
    <title>Squirtle Smart Garden</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="hero">
        <h1>🐢 Squirtle Smart Garden</h1>
        <p>ESP32 Automated Plant Watering System</p>
    </header>

    <section class="dashboard-grid">

        <div class="info-card">
            <h2>🌡 Temperature</h2>
            <p class="value">24°C</p>

            <h2>💧 Humidity</h2>
            <p class="value">55%</p>
        </div>

        <div class="info-card">
            <h2>🚰 Water Level</h2>
            <p class="value good">OK</p>

            <h2>🕒 Last Watered</h2>
            <p class="value">7:43 PM</p>
        </div>

        <div class="info-card">
            <h2>⚙️ Pump Status</h2>
            <p class="value off">OFF</p>

            <h2>⏳ Cooldown</h2>
            <p class="value good">Ready</p>
        </div>

    </section>

</body>

</html>
